<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TimeTrack</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Custom titlebar: whole strip is a drag region except the controls -->
    <header id="titlebar">
      <div class="titlebar-left">
        <button id="settingsBtn" class="icon-btn" title="Settings">
          <svg viewBox="0 0 24 24" width="15" height="15"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
        </button>
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">TimeTrack</span>
        </div>
      </div>
      <div class="titlebar-actions">
        <button id="minimizeBtn" class="icon-btn" title="Minimize">
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button id="maximizeBtn" class="icon-btn" title="Toggle window size">
          <svg viewBox="0 0 24 24" width="13" height="13"><rect x="5" y="5" width="14" height="14" rx="1.5" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
        </button>
        <button id="closeBtn" class="icon-btn danger" title="Close">
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <!-- Settings tab: pin-to-top, export, theme colors -->
    <div id="settingsPanel" class="settings-panel hidden">
      <div class="settings-row">
        <span>Keep on top</span>
        <label class="switch">
          <input type="checkbox" id="pinToggle" />
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </label>
      </div>
      <button id="exportBtn" class="settings-action">
        <svg viewBox="0 0 24 24" width="13" height="13"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 19h14" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Export report (CSV)
      </button>
      <div class="settings-divider"></div>
      <div class="settings-row">
        <span>Main color</span>
        <input type="color" id="primaryColorInput" class="color-input" />
      </div>
      <div class="settings-row">
        <span>Secondary color</span>
        <input type="color" id="secondaryColorInput" class="color-input" />
      </div>
      <button id="resetColorsBtn" class="settings-action subtle">Reset colors</button>
    </div>

    <div class="toolbar">
      <h1>Projects</h1>
      <button id="addProjectBtn" class="add-btn">
        <span class="plus">+</span> Add Project
      </button>
    </div>

    <div class="sort-row">
      <label for="sortSelect">Sort by</label>
      <select id="sortSelect">
        <option value="name">Name</option>
        <option value="rate">Hourly rate</option>
        <option value="bill">Current bill</option>
      </select>
    </div>

    <div id="sleepBanner" class="sleep-banner hidden">
      Timer paused — the system was asleep.
    </div>

    <main id="projectList" class="project-list" aria-live="polite">
      <!-- project cards injected here -->
    </main>

    <div id="emptyState" class="empty-state hidden">
      <div class="empty-ring"></div>
      <p>No projects yet.</p>
      <p class="muted">Add one to start tracking billable time.</p>
    </div>
  </div>

  <!-- hidden input used to pick a project logo image; reused across cards -->
  <input type="file" id="logoInput" accept="image/*" class="hidden" />

  <!-- Add / Edit project modal -->
  <dialog id="projectDialog" class="project-dialog">
    <form id="projectForm" method="dialog">
      <h2 id="dialogTitle">New Project</h2>
      <label class="field">
        <span>Name</span>
        <input id="projectName" type="text" maxlength="60" required autocomplete="off" placeholder="e.g. Acme Website Redesign" />
      </label>
      <label class="field">
        <span>Hourly rate (optional)</span>
        <input id="projectRate" type="number" min="0" step="0.01" placeholder="0.00" />
      </label>
      <label class="field">
        <span>People billing this project</span>
        <input id="projectPeople" type="number" min="1" step="1" value="1" />
      </label>
      <p class="field-hint">Bill is multiplied by this number — e.g. 2 people pairing for 1 tracked hour bills as 2 hours.</p>
      <div class="dialog-actions">
        <button type="button" id="dialogCancel" class="btn-secondary">Cancel</button>
        <button type="submit" id="dialogSave" class="btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Card action menu — contents are built in JS per-project (e.g. "Remove
       logo" only shows when a logo exists) and repositioned on open to stay
       inside the viewport regardless of where the card sits in the list. -->
  <div id="cardMenu" class="card-menu hidden"></div>

  <script src="main.js"></script>
</body>
</html>
