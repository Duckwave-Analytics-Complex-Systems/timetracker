<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TimeTrack</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Custom titlebar: whole strip is a drag region except the controls -->
    <header id="titlebar" data-tauri-drag-region>
      <div class="brand" data-tauri-drag-region>
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">TimeTrack</span>
      </div>
      <div class="titlebar-actions">
        <button id="pinBtn" class="icon-btn" title="Keep on top" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 2l1.5 5.5L19 9l-4.5 3L16 18l-4-3.2L8 18l1.5-6L5 9l5.5-1.5L12 2z" fill="currentColor"/></svg>
        </button>
        <button id="exportBtn" class="icon-btn" title="Export report">
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 19h14" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="closeBtn" class="icon-btn danger" title="Close">
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <div class="toolbar">
      <h1>Projects</h1>
      <button id="addProjectBtn" class="add-btn">
        <span class="plus">+</span> Add Project
      </button>
    </div>

    <div id="sleepBanner" class="sleep-banner hidden">
      Timer paused — the system was asleep.
    </div>

    <main id="projectList" class="project-list" aria-live="polite">
      <!-- project cards injected here -->
    </main>

    <div id="emptyState" class="empty-state hidden">
      <div class="empty-ring"></div>
      <p>No projects yet.</p>
      <p class="muted">Add one to start tracking billable time.</p>
    </div>
  </div>

  <!-- Add / Edit project modal -->
  <dialog id="projectDialog" class="project-dialog">
    <form id="projectForm" method="dialog">
      <h2 id="dialogTitle">New Project</h2>
      <label class="field">
        <span>Name</span>
        <input id="projectName" type="text" maxlength="60" required autocomplete="off" placeholder="e.g. Acme Website Redesign" />
      </label>
      <label class="field">
        <span>Hourly rate (optional)</span>
        <input id="projectRate" type="number" min="0" step="0.01" placeholder="0.00" />
      </label>
      <div class="dialog-actions">
        <button type="button" id="dialogCancel" class="btn-secondary">Cancel</button>
        <button type="submit" id="dialogSave" class="btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Card action menu (edit / reset / delete) -->
  <div id="cardMenu" class="card-menu hidden">
    <button data-action="edit">Edit</button>
    <button data-action="reset">Reset time</button>
    <button data-action="delete" class="danger">Delete</button>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
