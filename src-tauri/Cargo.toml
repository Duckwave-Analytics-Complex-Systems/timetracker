[package]
name = "timetrack-widget"
version = "5.0.0"
description = "Lightweight cross-platform billable time tracking widget"
authors = ["Duckwave Physics Inspired, Modeling and Analytics", "pplalo"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["tray-icon"] }
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

# Bundled sqlite (via the `bundled` feature above) means no system libsqlite3
# is required on either Windows or Linux -- keeps the build reproducible.

# Signal handling (pause the timer on SIGTERM/SIGINT/SIGHUP), see src/shutdown.rs.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "timetrack-widget"
path = "src/main.rs"
